<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools Raka — by Raka</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#121218;--border:#1f1f2e;--acc:#8b5cf6;--acc2:#a78bfa;--txt:#fff;--mut:#8e8e99;--ok:#22c55e}
body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#0d0d14;border-bottom:1px solid var(--border);font-size:12.5px;position:sticky;top:0;z-index:100}
.topbar .links{display:flex;gap:16px;align-items:center}
.topbar a{color:var(--mut);text-decoration:none;cursor:pointer}
.topbar a:hover{color:var(--acc2)}
.mbtn{width:30px;height:30px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.hero{position:relative;height:340px;overflow:hidden;display:flex;align-items:flex-end}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.hero .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,.95) 5%,rgba(10,10,15,.3) 50%,rgba(10,10,15,.1))}
.hero .ht{position:relative;padding:0 24px 28px;z-index:2}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800;background:linear-gradient(135deg,#c4b5fd,#8b5cf6,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.hero h1 .bolt{color:#fbbf24;-webkit-text-fill-color:#fbbf24}
.hero p{color:var(--mut);margin-top:6px;font-size:14px}
.hero p b{color:var(--acc2)}
.status{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px;background:#0d0d14;border-bottom:1px solid var(--border)}
.st{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12.5px}
.st .lbl{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.st .val{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
.free-badge{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:800;padding:8px 18px;border-radius:10px;font-size:12.5px}
.pills{display:flex;gap:10px;padding:18px 20px;overflow-x:auto;position:sticky;top:51px;background:var(--bg);z-index:90}
.pill{padding:10px 20px;border-radius:50px;background:var(--card);border:1px solid var(--border);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.pill.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:6px 20px 40px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 8px 30px rgba(139,92,246,.25)}
.card .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.card p{font-size:12.5px;color:var(--mut);line-height:1.6;min-height:40px}
.card .tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.5px}
.tag.free{background:rgba(34,197,94,.15);color:#22c55e}
.tag.cat{background:rgba(139,92,246,.15);color:var(--acc2)}
.card .arr{position:absolute;right:18px;bottom:18px;color:var(--mut);font-size:18px}
.sec-t{padding:10px 20px;max-width:1200px;margin:0 auto}
.sec-t h2{font-size:20px;font-weight:800}
.sec-t p{color:var(--mut);font-size:13px;margin-top:4px}
/* Tool view overlay */
#toolview{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto}
#toolview.show{display:block}
.tv-head{display:flex;align-items:center;gap:14px;padding:16px 20px;background:#0d0d14;border-bottom:1px solid var(--border);position:sticky;top:0}
.tv-back{background:var(--card);border:1px solid var(--border);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600}
.tv-back:hover{border-color:var(--acc)}
.tv-head h2{font-size:18px;font-weight:800}
.tv-body{max-width:640px;margin:0 auto;padding:24px 20px 60px}
.tv-body .inp,.tv-body textarea,.tv-body select{width:100%;background:#0c0c10;border:1px solid var(--border);color:#fff;padding:13px;border-radius:12px;font-size:14px;margin:8px 0;font-family:inherit}
.tv-body textarea{min-height:110px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:13px}
.tv-body .inp:focus,.tv-body textarea:focus{outline:none;border-color:var(--acc)}
.tbtn{background:linear-gradient(135deg,var(--acc),#6366f1);border:0;color:#fff;padding:13px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin:6px 4px 6px 0}
.tbtn.ghost{background:var(--card);border:1px solid var(--border)}
.tbtn:active{transform:scale(.97)}
.tout{background:#0c0c10;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px;font-size:13.5px;line-height:1.7;word-break:break-word;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;max-height:400px;overflow-y:auto}
.tout.big{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.trow label{font-size:13px;color:var(--mut);min-width:110px}
.trow input[type=range]{flex:1}
.trow input[type=number]{width:70px;background:#0c0c10;border:1px solid var(--border);color:#fff;padding:8px;border-radius:8px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.calc button{background:var(--card);border:1px solid var(--border);color:#fff;font-size:20px;padding:18px 0;border-radius:12px;cursor:pointer;font-family:inherit}
.calc button:hover{border-color:var(--acc)}
.calc button.op{background:rgba(139,92,246,.15);color:var(--acc2);font-weight:700}
.calc button.eq{background:linear-gradient(135deg,var(--acc),#6366f1);font-weight:700}
#calcDisp{background:#0c0c10;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:right;font-size:28px;font-family:'JetBrains Mono',monospace;min-height:70px;overflow-x:auto;white-space:nowrap}
.qrbox{text-align:center;margin-top:12px}
.qrbox img{max-width:260px;border-radius:12px;border:1px solid var(--border)}
footer{text-align:center;padding:30px 20px;color:#52525b;font-size:12.5px;border-top:1px solid var(--border)}
footer b{color:var(--acc2)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;max-width:440px;width:100%;text-align:center}
.mbox h3{font-size:18px;margin-bottom:10px}
.mbox p{color:var(--mut);font-size:13.5px;line-height:1.7;margin-bottom:20px}
.mbtn2{background:#22c55e;color:#000;font-weight:700;padding:12px 28px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:14px}
.mclose{margin-top:12px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;font-family:inherit}
.chatbox{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:380px;overflow-y:auto;padding:4px}
.msg{padding:12px 16px;border-radius:14px;font-size:13.5px;line-height:1.65;max-width:90%}
.msg.ai{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.msg.me{background:linear-gradient(135deg,var(--acc),#6366f1);align-self:flex-end}
.msg.typing{opacity:.6}
@media(max-width:600px){.hero{height:260px}.grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 12px 30px}.card{padding:16px}}
</style>
</head>

<script>
/* ============ CORE ============ */
const $=id=>document.getElementById(id);
const grid=$('grid'),pills=$('pills');
CATS.forEach(([v,l],i)=>{
 const b=document.createElement('button');
 b.className='pill'+(i===0?' active':'');b.textContent=l;b.dataset.cat=v;
 b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(v);};
 pills.appendChild(b);
});
function render(cat){
 grid.innerHTML='';
 const list=TOOLS.filter(t=>cat==='all'||t.c===cat);
 $('secTitle').textContent=cat==='all'?'Semua Tools':CATS.find(c=>c[0]===cat)[1
];
 $('toolCount').textContent=list.length+' tools • Semua gratis!';
 list.forEach(t=>{
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class="ic" style="background:${t.bg}">${t.icon}</div><h3>${t.n}</h3><p>${t.d}</p><div class="tags">${t.tags.map(x=>`<span class="tag ${x==='GRATIS'?'free':'cat'}">${x}</span>`).join('')}</div><span class="arr">→</span>`;
  d.onclick=()=>openTool(t);grid.appendChild(d);
 });
}
function openTool(t){
 if(t.ext){window.open(t.url,'_blank');return;}
 $('tvTitle').textContent=t.icon+' '+t.n;
 $('tvBody').innerHTML='';
 TOOLFN[t.fn]($('tvBody'));
 $('toolview').classList.add('show');window.scrollTo(0,0);
 $('toolview').scrollTop=0;
}
function closeTool(){$('toolview').classList.remove('show');}
function el(html){const d=document.createElement('div');d.innerHTML=html;return d;}
function outBox(cls){const d=document.createElement('div');d.className='tout '+(cls||'');return d;}
/* Status */
try{fetch('https://ipwho.is/').then(r=>r.json()).then(j=>{$('stCountry').textContent=j.country||'Unknown';}).catch(()=>{$('stCountry').textContent='Indonesia';});}catch(e){$('stCountry').textContent='Indonesia';}
(()=>{const ua=navigator.userAgent;$('stDevice').textContent=/Android/i.test(ua)?'Android':/iPhone|iPad/i.test(ua)?'iOS':'Desktop';$('stBrowser').textContent=/Chrome/i.test(ua)?'Chrome':/Firefox/i.test(ua)?'Firefox':/Safari/i.test(ua)?'Safari':'Browser';})();
/* Modal */
const MODALS={about:{t:"About Dev",d:"Tools Raka dibuat 100% oleh Raka. Kumpulan tools terbaik — AI, bypass, security — semua gratis tanpa VIP!"},
bug:{t:"Report Bug",d:"Ketemu bug? Kasih tau Raka: tool apa, apa yang terjadi, + screenshot kalau ada. Pasti dibenerin!"},
wa:{t:"Saluran WhatsApp",d:"Gabung saluran WhatsApp Raka buat update tools terbaru!",btn:"Gabung ke Saluran"}};
function openModal(k){const m=MODALS[k];$('mbox').innerHTML=`<h3>${m.t}</h3><p>${m.d}</p>${m.btn?`<button class="mbtn2" onclick="closeModal()">${m.btn}</button><br>`:''}<button class="mclose" onclick="closeModal()">Tutup</button>`;$('modal').classList.add('show');}
function closeModal(){$('modal').classList.remove('show');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
let _mut=true;$('muteBtn').onclick=function(){_mut=!_mut;this.textContent=_mut?'🔇':'🔊';};
render('all');

/* ============ TOOLS ============ */
const TOOLFN={};
/* --- Tanya AI (pollinations) --- */
TOOLFN.tanyaAI=box=>{
 box.innerHTML=`<div class="chatbox" id="cb"></div>
 <div class="trow"><input class="inp" id="ci" placeholder="Tanya apa aja..." style="flex:1;margin:0"><button class="tbtn" id="cs">Kirim</button></div>`;
 const cb=$('cb'),ci=$('ci');
 function addMsg(t,me){const d=document.createElement('div');d.className='msg '+(me?'me':'ai');d.textContent=t;cb.appendChild(d);cb.scrollTop=cb.scrollHeight;return d;}
 addMsg('Halo! Aku AI Tools Raka. Tanya apa aja!','');
 async function send(){
  const q=ci.value.trim();if(!q)return;ci.value='';addMsg(q,true);
  const tp=addMsg('Mengetik...','');tp.classList.add('typing');
  try{
   const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'Kamu asisten AI Tools Raka buatan Raka. Jawab Bahasa Indonesia, ramah, singkat.'},{role:'user',content:q}],model:'openai',private:true})});
   const t=await r.text();tp.classList.remove('typing');tp.textContent=t.slice(0,2000)||'Maaf, coba lagi!';
  }catch(e){tp.classList.remove('typing');tp.textContent='Gagal konek. Coba lagi!';}
  cb.scrollTop=cb.scrollHeight;
 }
 $('cs').onclick=send;ci.onkeydown=e=>{if(e.key==='Enter')send();};
};
/* --- Text to Image --- */
TOOLFN.txt2img=box=>{
 box.innerHTML=`<input class="inp" id="ti" placeholder="Contoh: anime girl with purple hair"><button class="tbtn" id="tg">Generate</button><div class="qrbox" id="to"></div>`;
 $('tg').onclick=()=>{
  const p=$('ti').value.trim();if(!p){$('to').innerHTML='<p style="color:var(--mut)">Isi prompt dulu!</p>';return;}
  const s=Math.floor(Math.random()*99999);
  $('to').innerHTML='<p style="color:var(--mut)">Generate...</p><br><img id="gi" style="opacity:.4">';
  const img=new Image();
  img.onload=()=>{$('to').innerHTML='';$('to').appendChild(img);};
  img.onerror=()=>{$('to').innerHTML='<p style="color:#ef4444">Gagal. Coba lagi!</p>';};
  img.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=512&height=512&seed=${s}&nologo=true&model=flux`;
  img.style.maxWidth='100%';img.style.borderRadius='12px';
 };
};
/* --- Kalkulator --- */
TOOLFN.kalkulator=box=>{
 box.innerHTML=`<div id="calcDisp">0</div><div class="calc" id="ck"></div>`;
 const disp=$('calcDisp');let cur='0',op=null,prev=null,fresh=true;
 const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','='];
 const ck=$('ck');
 keys.forEach(k=>{
  const b=document.createElement('button');b.textContent=k;
  if('÷×-+'.includes(k))b.className='op';if(k==='=')b.className='eq';
  b.onclick=()=>press(k);ck.appendChild(b);
 });
 function press(k){
  if(k==='C'){cur='0';op=null;prev=null;fresh=true;}
  else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0';}
  else if('÷×-+'.includes(k)){calc();op=k;prev=parseFloat(cur);fresh=true;}
  else if(k==='='){calc();op=null;fresh=true;}
  else if(k==='%'){cur=String(parseFloat(cur)/100);}
  else{if(fresh){cur=(k==='.')?'0.':k;fresh=false;}else{if(k==='.'&&cur.includes('.'))return;cur=cur==='0'&&k!=='.'?k:cur+k;}}
  disp.textContent=cur;
 }
 function calc(){
  if(op===null||prev===null)return;
  const a=prev,b=parseFloat(cur);let r=b;
  if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='×')r=a*b;else if(op==='÷')r=b!==0?a/b:NaN;
  cur=String(Math.round(r*1e10)/1e10);prev=null;
 }
};

  words.forEach(w=>{if(x.measureText(line+' '+w).width>440){x.fillText(line,20,y);y+=26;line=w;}else line+=' '+w;});
  x.fillText(line,20,y);
  x.fillStyle='#c0c0c0';x.fillRect(200,155,100,32);
  x.fillStyle='#000';x.textAlign='center';x.fillText('OK',250,177);
 }
 $('wqg').onclick=draw;draw();
 $('wqd').onclick=()=>{const a=document.createElement('a');a.download='winquote.png';a.href=$('wqc').toDataURL();a.click();};
};

/* --- TikTok Downloader --- */
TOOLFN.ttdl=box=>{
 box.innerHTML=`<input class="inp" id="tti" placeholder="Tempel link TikTok di sini...">`
 +`<button class="tbtn" id="ttg">Ambil Video</button><div class="qrbox" id="tto" style="display:none"></div>`;
 const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 $('ttg').onclick=async()=>{
  const u=$('tti').value.trim(),o=$('tto');
  if(!/tiktok\.com\//i.test(u)){o.style.display='block';o.innerHTML='<p style="color:#f87171">Itu bukan link TikTok, Tuan. Tempel link video TikTok ya.</p>';return;}
  o.style.display='block';o.innerHTML='<p style="color:var(--mut)">Lagi ngambil videonya...</p>';
  try{
   const r=await fetch('/api/tiktok?url='+encodeURIComponent(u));
   const j=await r.json();
   if(!j.ok){o.innerHTML='<p style="color:#f87171">'+esc(j.error||'Gagal.')+'</p>';return;}
   const mins=Math.floor((j.duration||0)/60),secs=(j.duration||0)%60;
   o.innerHTML=(j.cover?`<img src="${j.cover}" style="max-width:100%;border-radius:12px">`:'')
    +`<p style="margin:8px 0"><b>${esc(j.title)}</b><br><span style="color:var(--mut)">${esc(j.author)}${j.duration?' • '+mins+':'+String(secs).padStart(2,'0'):''}</span></p>`
    +`<a href="${j.base}&go=1" target="_blank" rel="noopener"><button class="tbtn">⬇ Download Tanpa Watermark</button></a> `
    +`<a href="${j.base}&go=3" target="_blank" rel="noopener"><button class="tbtn ghost">🎵 Download Audio</button></a><br><br>`
    +`<a href="${j.base}&go=2" target="_blank" rel="noopener" style="color:var(--mut);font-size:13px">atau versi watermark</a>`;
  }catch(e){o.innerHTML='<p style="color:#f87171">Koneksi lagi bermasalah. Coba lagi ya.</p>';}
 };
};
